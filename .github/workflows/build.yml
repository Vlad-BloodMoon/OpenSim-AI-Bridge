name: Build OpenSim AI Bridge (.NET 8)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/build.yml'
      - 'scripts/**'
      - 'deploy/**'
      - 'controller/**'
      - 'web/**'
      - 'tests/**'
      - 'knowledge/**'
      - 'docs/MULTI_BOT_V02_FR.md'
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and package Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate control scripts and web dashboard
        run: |
          bash -n scripts/*.sh
          python3 -m py_compile controller/control.py controller/multi_bot.py controller/provider_profiles.py knowledge/knowledge_cli.py
          python3 -m unittest discover -s tests -v
          php -l web/OpenSim_AI/index.php

      - name: Restore dependencies
        run: dotnet restore src/OpenSimAiBridge.Bot/OpenSimAiBridge.Bot.csproj

      - name: Compile in Release configuration
        run: dotnet build src/OpenSimAiBridge.Bot/OpenSimAiBridge.Bot.csproj -c Release --no-restore

      - name: Verify invariant rate under French locale
        env:
          LANG: fr_FR.UTF-8
          LC_ALL: fr_FR.UTF-8
        run: dotnet run --project src/OpenSimAiBridge.Bot/OpenSimAiBridge.Bot.csproj -c Release --no-build -- --verify-invariant-rate

      - name: Verify remote AI safe defaults without API credentials
        run: dotnet run --project src/OpenSimAiBridge.Bot/OpenSimAiBridge.Bot.csproj -c Release --no-build -- --verify-ai-safety

      - name: Verify shared SQLite knowledge retrieval without a database
        run: dotnet run --project src/OpenSimAiBridge.Bot/OpenSimAiBridge.Bot.csproj -c Release --no-build -- --verify-knowledge

      - name: Verify shared quotas across simulated avatars
        run: dotnet run --project src/OpenSimAiBridge.Bot/OpenSimAiBridge.Bot.csproj -c Release --no-build -- --verify-shared-quota

      - name: Publish for Linux x64 (framework-dependent)
        run: |
          dotnet publish src/OpenSimAiBridge.Bot/OpenSimAiBridge.Bot.csproj \
            -c Release -r linux-x64 --self-contained false \
            -o dist/linux-x64

      - name: Bundle documentation and example config
        run: |
          mkdir -p dist/linux-x64/config
          cp config/appsettings.example.json dist/linux-x64/config/
          cp docs/INSTALLATION_V01_FR.md dist/linux-x64/
          cp docs/SERVICE_SYSTEMD_V02_FR.md dist/linux-x64/
          cp bot-password.example.txt dist/linux-x64/
          mkdir -p dist/linux-x64/scripts dist/linux-x64/deploy/systemd
          cp scripts/*.sh dist/linux-x64/scripts/
          chmod +x dist/linux-x64/scripts/*.sh
          cp deploy/systemd/*.example dist/linux-x64/deploy/systemd/
          mkdir -p dist/linux-x64/knowledge
          cp knowledge/knowledge_cli.py dist/linux-x64/knowledge/
          mkdir -p dist/linux-x64/controller dist/linux-x64/web/OpenSim_AI
          cp controller/control.py controller/multi_bot.py controller/provider_profiles.py dist/linux-x64/controller/
          cp web/OpenSim_AI/index.php web/OpenSim_AI/.htaccess dist/linux-x64/web/OpenSim_AI/
          cp docs/WEB_INSTALL_V02_FR.md dist/linux-x64/
          cp docs/MULTI_BOT_V02_FR.md docs/REMOTE_AI_V03_FR.md dist/linux-x64/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSim-AI-Bridge-v0.2-preview-linux-x64
          path: dist/linux-x64/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
